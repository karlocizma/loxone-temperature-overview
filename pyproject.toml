[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "temperature-processing"
version = "0.1.0"
description = "Process raw temperature logs into 3-hour interval summaries by day of week with weekly overview."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
